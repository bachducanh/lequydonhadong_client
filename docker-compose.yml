# Website Trường THPT Lê Quý Đôn – Hà Đông
#
#   docker compose up -d                      -> chỉ Postgres + Redis (dùng khi dev API/Web trên máy)
#   docker compose --profile app up -d --build -> chạy toàn bộ: Postgres, Redis, API, Web
#   Máy chủ thật: xem docker-compose.prod.yml và deploy/HUONG-DAN.md
#
# Cổng mặc định phía máy chủ: Postgres 5433, Redis 6380, API 4000, Web 3000 (đổi trong .env).
# Tên dịch vụ có tiền tố lqd- để không trùng tên khi nối chung mạng Docker với dự án khác.

name: lqd-hadong

services:
  lqd-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lqd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lqd_secret}
      POSTGRES_DB: ${POSTGRES_DB:-lqd_hadong}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  lqd-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  lqd-api:
    profiles: ["app"]
    build: ./apps/api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-lqd}:${POSTGRES_PASSWORD:-lqd_secret}@lqd-postgres:5432/${POSTGRES_DB:-lqd_hadong}?schema=public
      REDIS_URL: redis://lqd-redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
    depends_on:
      lqd-postgres:
        condition: service_healthy
      lqd-redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - uploads:/app/uploads

  lqd-web:
    profiles: ["app"]
    build: ./apps/web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://lqd-api:4000
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    depends_on:
      - lqd-api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  redisdata:
  uploads:
